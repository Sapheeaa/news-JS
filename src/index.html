<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>

        <footer>
            <!-- Старый копирайт оставляем -->
            <p class="copyright">Copyright <a href="https://newsapi.org">NewsAPI</a></p>

            <!-- Новый блок по ТЗ -->
            <div class="footer__wrapper">
                <!-- Замени ТВОЙ_НИК на свой ник в GitHub -->
                <a class="footer__link" href="https://github.com/Sapheeaa" target="_blank" rel="noopener noreferrer">
                    My gitHub
                </a>
                <span class="footer__year">2026</span>
                <a class="footer__logo-link" href="https://rs.school/" target="_blank" rel="noopener noreferrer">
                    <img
                        class="footer__logo"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvtc_dvPZLiHJKwtL3CzLUFwY-RNjuMaEuv9kg-NkdIQf-E1yehSN9i8am&s=10"
                        alt="RS School Logo"
                    />
                </a>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
